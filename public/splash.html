<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Song Cast</title>
    <script>
      // Immediate theme preference detection
      (function () {
        try {
          var stored = localStorage.getItem("songsDarkMode");
          var isDark = true;
          if (stored !== null) {
            isDark = stored === "true";
          } else if (window.matchMedia) {
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          if (!isDark) {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          // Default to sleek dark
        }
      })();
    </script>
    <style>
      @font-face {
        font-family: "Raleway";
        font-style: normal;
        font-weight: 300;
        src: url(./fonts/raleway-300.woff2) format("woff2");
      }
      @font-face {
        font-family: "Raleway";
        font-style: normal;
        font-weight: 600;
        src: url(./fonts/raleway-600.woff2) format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Default Dark Mode Theme */
        --splash-bg: #1c1c1c;
        --splash-bg-grad: radial-gradient(circle at 50% 36%, #252528 0%, #1c1c1e 58%, #131314 100%);
        --splash-border: rgba(255, 255, 255, 0.08);
        --splash-text: #f3f4f6;
        --splash-text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), 0 0 16px rgba(255, 255, 255, 0.08);
        --splash-sub: rgba(255, 255, 255, 0.45);
        --splash-divider: rgba(255, 255, 255, 0.18);
        --splash-glow: rgba(255, 255, 255, 0.08);
        --splash-shadow: rgba(0, 0, 0, 0.6);
        --particle-color: rgba(255, 255, 255, 0.08);
        --tile-border: rgba(255, 255, 255, 0.1);
        --tile-shadow: rgba(0, 0, 0, 0.4);
        --tile-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0.35) 100%);
        --loader-track: rgba(255, 255, 255, 0.1);
        --loader-track-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        --loader-bar: linear-gradient(90deg, #71717a 0%, #d4d4d8 42%, #ffffff 50%, #d4d4d8 58%, #71717a 100%);
        --loader-glow: 0 0 8px rgba(255, 255, 255, 0.35), 0 0 2px rgba(255, 255, 255, 0.7);
      }

      html.light {
        /* Light Mode Theme */
        --splash-bg: #a0a0a0;
        --splash-bg-grad: radial-gradient(circle at 50% 36%, #adadad 0%, #9e9e9e 58%, #8e8e8e 100%);
        --splash-border: rgba(0, 0, 0, 0.16);
        --splash-text: #1c1c1c;
        --splash-text-shadow: 0 1px 2px rgba(255, 255, 255, 0.25);
        --splash-sub: rgba(28, 28, 28, 0.65);
        --splash-divider: rgba(0, 0, 0, 0.22);
        --splash-glow: rgba(0, 0, 0, 0.06);
        --splash-shadow: rgba(0, 0, 0, 0.25);
        --particle-color: rgba(0, 0, 0, 0.07);
        --tile-border: rgba(0, 0, 0, 0.14);
        --tile-shadow: rgba(0, 0, 0, 0.18);
        --tile-overlay: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.08) 100%);
        --loader-track: rgba(0, 0, 0, 0.14);
        --loader-track-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        --loader-bar: linear-gradient(90deg, #52525b 0%, #27272a 42%, #18181b 50%, #27272a 58%, #52525b 100%);
        --loader-glow: 0 0 6px rgba(0, 0, 0, 0.22);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
      }

      body {
        background: var(--splash-bg-grad);
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Raleway", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
        box-sizing: border-box;
      }

      /* Floating dust particles */
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: floatUp linear infinite;
      }

      /* Main content – perfectly centered in card */
      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 8px;
        opacity: 0;
        transform: translateY(6px);
        animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
        position: relative;
        z-index: 10;
        margin-top: -10px; /* balances the bottom progress track */
      }

      .app-name {
        color: var(--splash-text);
        font-family: "Raleway", "Segoe UI", system-ui, sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-shadow: var(--splash-text-shadow);
        text-align: center;
        padding-left: 0.28em; /* optical center with letter-spacing */
      }

      /* Thin decorative line */
      .divider {
        width: 52px;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--splash-divider),
          transparent
        );
        margin: 2px 0;
      }

      .app-sub {
        color: var(--splash-sub);
        font-family: "Raleway", "Segoe UI", system-ui, sans-serif;
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.44em;
        text-transform: uppercase;
        text-align: center;
        padding-left: 0.44em; /* optical center with letter-spacing */
      }

      /* Splash Loader - Progress track & bar */
      .progress-track {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 2.5px;
        background: var(--loader-track);
        box-shadow: var(--loader-track-shadow);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        animation: fadeIn 0.4s ease 0.25s forwards;
        z-index: 20;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: var(--loader-bar);
        background-size: 200% 100%;
        border-radius: 2px;
        box-shadow: var(--loader-glow);
        animation:
          load 1.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards,
          shimmer 1.5s linear 0.3s infinite;
      }

      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes load {
        0% {
          width: 0%;
        }
        55% {
          width: 68%;
        }
        80% {
          width: 86%;
        }
        100% {
          width: 100%;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @keyframes floatUp {
        0% {
          transform: translateY(110vh) rotate(0deg);
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        92% {
          opacity: 1;
        }
        100% {
          transform: translateY(-10vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // --- Floating ambient particles ---
      for (var i = 0; i < 16; i++) {
        var p = document.createElement("div");
        var size = Math.random() * 4 + 2;
        p.className = "particle";
        p.style.cssText =
          "width:" +
          size +
          "px;" +
          "height:" +
          size +
          "px;" +
          "background:var(--particle-color);" +
          "left:" +
          Math.random() * 100 +
          "%;" +
          "bottom:-10px;" +
          "z-index:1;" +
          "animation-duration:" +
          (13 + Math.random() * 11) +
          "s;" +
          "animation-delay:" +
          Math.random() * 9 +
          "s;";
        document.body.appendChild(p);
      }

      // Allow clicking anywhere or pressing Escape/Space to dismiss early
      window.addEventListener("click", function () {
        window.close();
      });
      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === " ") {
          window.close();
        }
      });
    </script>

    <div class="content">
      <div class="app-name">Song Cast</div>
      <div class="divider"></div>
      <div class="app-sub">Song Presentation</div>
    </div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </body>
</html>
